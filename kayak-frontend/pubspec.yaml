name: kayak_frontend
description: Kayak Scientific Research Support Platform
publish_to: 'none'
version: 3.0.0+1

environment:
  sdk: '>=3.8.0 <4.0.0'
  flutter: '>=3.19.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # ==================== 状态管理 ====================
  flutter_riverpod: ^3.3.1
  riverpod_annotation: ^4.0.0

  # ==================== 路由 ====================
  go_router: ^17.2.3

  # ==================== 网络通信 ====================
  dio: ^5.9.2
  web_socket_channel: ^3.0.3

  # ==================== 本地存储 ====================
  flutter_secure_storage: ^10.3.1
  shared_preferences: ^2.5.5

  # ==================== 数据序列化 ====================
  json_annotation: ^4.12.0

  # ==================== 图表与数据可视化 ====================
  fl_chart: ^1.2.0

  # ==================== 国际化 ====================
  intl: ^0.20.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

  # 代码生成工具
  build_runner: ^2.4.15
  json_serializable: ^6.9.4
  riverpod_generator: ^4.0.0

  # 测试工具
  mocktail: ^1.0.4

flutter:
  uses-material-design: true
  generate: true
